[project]
name = "reformer-museum"
version = "0.1.0"
description = "Modal backend for the Reformer museum text generation API"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.73.0",
    "transformers==5.10.2",
    "torch",
    "fastapi",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"